version: '3.8'

services:
  mcp-server:
    image: ghcr.io/imanhattan/container-mcp:latest
    container_name: mcp-docker-manager
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MCP_PORT=8443
      - PROTECTED_CONTAINERS=mcp-docker-manager
